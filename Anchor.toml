[toolchain]
anchor_version = "1.1.2"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

# This program lives in `program/` (not the Anchor default `programs/*`), so
# point Anchor's program discovery at it explicitly.
[workspace]
members = ["program"]

[programs.localnet]
mallow_jellybean = "J3LLYcm8V5hJRzCKENRPW3yGdQ6xU8Nie8jr3mU88eqq"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"
