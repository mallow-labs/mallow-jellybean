[package]
name = "mallow_jellybean"
version = "1.0.0"
edition = "2021"
readme = "./README.md"
license-file = "../LICENSE"
publish = false

[package.metadata.solana]
program-id = "J3LLYcm8V5hJRzCKENRPW3yGdQ6xU8Nie8jr3mU88eqq"
program-dependencies = [
    "SysExL2WDyJi9aRZrXorrjHJut3JwHQ7R9bTyctbNNG",
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",
    "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb",
    "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d",
    "GGRDy4ieS7ExrUu313QkszyuT9o3BvDLuc3H5VLgCpSF"
]
account-dependencies = []

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Declared so the cfgs that anchor's `#[program]` / `#[derive(Accounts)]`
# expansions reference resolve to known features under `-D warnings`.
anchor-debug = []
custom-heap = []
custom-panic = []

# `#[program]` also expands to `cfg(target_os = "solana")`, which rustc does not
# know about off-chain. anchor-lang declares the same check-cfg for itself.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = {version = "1.1.2", features = ["init-if-needed", "event-cpi"]}
anchor-spl = {version = "1.1.2"}
arrayref = ">=0.3.6"
solana-program = "4.0.0"
mpl-core = { version = "0.12.1" }